<!doctype html>
<html
  lang="pt-BR"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fundo Obsidiana","default":"#0B0D0A"},
    {"id":"color-ink","type":"color","label":"Marfim Arquival","default":"#F3EFE2"},
    {"id":"color-accent","type":"color","label":"Ouro Banana","default":"#E2B43B"},
    {"id":"color-leaf","type":"color","label":"Verde Folha","default":"#3B6E47"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ciclo de Vida da Banana (Musa spp.)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0B0D0A;
        --color-ink: #F3EFE2;
        --color-accent: #E2B43B;
        --color-leaf: #3B6E47;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .backdrop-ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 55% 42%, #141911 0%, #0B0D0A 72%);
        z-index: 0;
      }

      .scene-host {
        position: absolute;
        inset: 0;
        z-index: 10;
      }

      .captions-host {
        position: absolute;
        inset: 0;
        z-index: 80;
        pointer-events: none;
      }

      .film-grain {
        position: absolute;
        inset: 0;
        z-index: 60;
        pointer-events: none;
        opacity: 0.045;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      .progress-rail {
        position: absolute;
        left: 192px;
        top: 52px;
        width: 1536px;
        height: 4px;
        background: rgba(243, 239, 226, 0.16);
        z-index: 70;
        pointer-events: none;
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: #E2B43B;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="backdrop-ground" data-layout-ignore></div>

      <div
        id="scene-01"
        class="clip scene-host"
        data-composition-id="scene-01"
        data-composition-src="compositions/scene-01-rizoma.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-02"
        class="clip scene-host"
        data-composition-id="scene-02"
        data-composition-src="compositions/scene-02-floracao.html"
        data-start="12"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-03"
        class="clip scene-host"
        data-composition-id="scene-03"
        data-composition-src="compositions/scene-03-geotropismo.html"
        data-start="24"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-04"
        class="clip scene-host"
        data-composition-id="scene-04"
        data-composition-src="compositions/scene-04-climaterio.html"
        data-start="36"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-05"
        class="clip scene-host"
        data-composition-id="scene-05"
        data-composition-src="compositions/scene-05-sucessao.html"
        data-start="48"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="captions"
        class="clip captions-host"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="60"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>

      <div class="progress-rail" data-layout-ignore>
        <div id="global-progress-fill" class="progress-fill"></div>
      </div>

      <div class="film-grain" data-layout-ignore></div>

      <audio
        id="narration-track"
        class="clip"
        src="assets/ap01_narration.mp3"
        data-start="0"
        data-duration="59.1025"
        data-track-index="3"
        data-volume="1"
      ></audio>

      <audio
        id="ambient-bed"
        class="clip"
        src="assets/ambient_bed_60s.mp3"
        data-start="0"
        data-duration="60"
        data-track-index="4"
        data-volume="0.32"
        data-fade-in="0.8"
        data-fade-out="2.2"
      ></audio>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#global-progress-fill",
          { scaleX: 0 },
          { scaleX: 1, duration: 60, ease: "none" },
          0,
        );

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
